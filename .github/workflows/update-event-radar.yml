name: Update Scoops Event Radar

on:
  schedule:
    # 9:20 AM Eastern during daylight-saving time; 8:20 AM Eastern in winter.
    # Runs before the separate 9:40 AM ChatGPT Site refresh.
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoops-event-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source watcher dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check event sources and refresh discovery inbox
        run: python scripts/update_event_intel.py

      - name: Commit changed source health and discoveries
        run: |
          if git diff --quiet -- data/sources.json data/discoveries.json; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "Scoops Event Radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources.json data/discoveries.json
          git commit -m "Daily event radar refresh"
          git pull --rebase origin main
          git push
