99px;background:rgba(86,214,154,.10);border:1px solid rgba(86,214,154,.38);color:#b8f7d4;font-size:10px;font-weight:950;letter-spacing:.35px}.radarUpdateStamp span{width:7px;height:7px;border-radius:50%;background:#56d69a;box-shadow:0 0 12px rgba(86,214,154,.8)}.latestGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.latestItem{padding:12px;border:1px solid #355b72;border-radius:14px;background:linear-gradient(145deg,#122f47,#0c2436)}.latestItem h4{margin:5px 0}.latestItem small{color:#a9bfce;line-height:1.45}.latestDate{font-size:9px;font-weight:950;letter-spacing:.55px;text-transform:uppercase;color:#79e2e7}@media(max-width:700px){.latestGrid{grid-template-columns:1fr}}</style><script>(function(){function renderLatest(){if(typeof EVENTS==='undefined'||typeof DISCOVERIES==='undefined')return false;const target=document.getElementById('latestGrid');if(!target)return false;const items=[];EVENTS.forEach(e=>{const d=e.updatedAt||e.addedAt||e.sourceChecked;if(d)items.push({date:d,type:'Opportunity',name:e.name,detail:(e.vendorStatus||e.opportunityType||e.type||'')+(e.nextAction?' • '+e.nextAction:'')})});DISCOVERIES.forEach(d=>{const dt=d.updatedAt||d.firstSeen;if(dt)items.push({date:dt,type:'Discovery / idea',name:d.title||d.sourceName||'New discovery',detail:d.sourceName||d.url||''})});items.sort((a,b)=>String(b.date).localeCompare(String(a.date)));const recent=items.slice(0,8);const nav=document.getElementById('navLatest');if(nav)nav.textContent=recent.length;target.innerHTML=recent.length?recent.map(x=>'<div class="latestItem"><div class="latestDate">'+esc(x.date)+' • '+esc(x.type)+'</div><h4>'+esc(x.name)+'</h4><small>'+esc(x.detail||'Added to the radar.')+'</small></div>').join(''):'<div class="empty">No dated updates yet.</div>';return true}let tries=0;const t=setInterval(()=>{tries++;if(renderLatest()||tries>40)clearInterval(t)},250)})();<\/script>`;html=html.replace('</body>',addon+'</body>');document.open();document.write(html);document.
